name: Build and deploy Orbgem

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: matheusouza2/orbgem

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_KEY_FILE: ${{ runner.temp }}/orbgem_deploy_key

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

      - name: Create application directory
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            'mkdir -p /var/www/webapps/orbgem.com.br'

      - name: Upload production Compose file
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          scp -i "$SSH_KEY_FILE" \
            -P "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            docker-compose.production.yml \
            "$SERVER_USER@$SERVER_HOST:/var/www/webapps/orbgem.com.br/docker-compose.production.yml"

      - name: Pull and restart production services
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i "$SSH_KEY_FILE" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

          ssh -i "$SSH_KEY_FILE" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            "set -eu; cd /var/www/webapps/orbgem.com.br; test -f .env; export IMAGE_TAG='$IMAGE_TAG'; docker compose -f docker-compose.production.yml config --quiet; docker compose -f docker-compose.production.yml pull; docker compose -f docker-compose.production.yml up -d --remove-orphans; docker compose -f docker-compose.production.yml ps"
